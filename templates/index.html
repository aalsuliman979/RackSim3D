<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RackSim 3D</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background-color: #ffffff;

            font-family: Arial, sans-serif;
        }


        canvas {
            display: block;

            width: 100vw;
            height: 100vh;

            position: absolute;

            top: 0;
            left: 0;

            z-index: 1;
        }


        #info-panel {

            position: absolute;

            top: 20px;
            right: 20px;

            width: 300px;

            padding: 18px 20px;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 10px;

            border: 2px solid #00bfa5;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.15);

            color: #222;

            z-index: 10;
        }


        h2 {

            margin: 0 0 10px 0;

            color: #009f89;

            font-size: 20px;
        }


        p {

            margin: 0;

            font-size: 14px;

            line-height: 1.6;

            color: #333;
        }

    </style>


    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

</head>


<body>


    <div id="info-panel">

        <h2>RackSim 3D</h2>

        <p id="desc">
            مرحباً بك! اسحب بالماوس لتدوير الكابينة
            وانقر على السيرفر للتفاعل.
        </p>

    </div>


    <script src="{{ url_for('static', filename='js/main.js') }}?v=3"></script>

</body>

</html>
